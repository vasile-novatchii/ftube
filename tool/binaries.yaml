# Desktop binaries bundled with Ftube (spec D-1, D-2, D-14).
#
# `dart run tool/fetch_binaries.dart` downloads each artifact for the target
# platform, checks its SHA-256 and extracts the listed files:
#   files: { <path inside the archive, or "." for a plain file>: <output name> }
# Entries that share an output name and set `arch` are merged with
# `lipo -create` into one universal macOS binary.
#
# To update a binary, change url and sha256 together and take the checksum
# from the publisher (SHA2-256SUMS, *.sha256, checksums.sha256).
#
# Versions: yt-dlp 2026.10.26, FFmpeg 9.0.2, Deno 2.9.8.

